<!doctype html>
<html lang="id"><head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keranjang - GPS Mitra dari Akun Terdaftar</title>
<style>
:root{--g:#00a85a;--c:#00c8a0;--y:#ffd400;--ink:#18312b;--line:#dceee5}
body{margin:0;background:#f4fff7;font:14px system-ui,sans-serif}
header{background:linear-gradient(90deg,#00a85a,#00c8a0);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px;box-shadow:0 2px 8px #0001}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--g),var(--c));color:#fff;width:100%}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf4ef}
.badge{background:#e6f7ef;color:#087443;border:1px solid #c3ead7;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.note{padding:10px;border-radius:10px;margin:8px 0;font-size:12px} .ok{background:#e5fff0;color:#087b45} .err{background:#fff0ed;color:#b42318}
.muted{color:#66756f;font-size:12px}
</style>
</head><body>
<header><div><b>Keranjang Belanja</b><br><small>GPS Pelanggan → GPS Mitra (dari akun terdaftar) • 0-3km=5k</small></div><a href="index.html" style="color:#fff;text-decoration:none;">← Belanja</a></header>
<main id="main"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getFirestore,collection,query,where,getDocs} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyBxqZhl6t3RwrXMwVdJeIkg0NzGfwvlweM",authDomain: "toko-siap-antar-9a7bb.firebaseapp.com",projectId: "toko-siap-antar-9a7bb",storageBucket: "toko-siap-antar-9a7bb.firebasestorage.app",messagingSenderId: "351335838712",appId: "1:351335838712:web:14cc2c7b91bb0c9e1b5c0d"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);

function hitungJarakKm(lat1,lng1,lat2,lng2){
  if(!lat1||!lng1||!lat2||!lng2) return null;
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function hitungOngkirFinal(jarakKm){
  if(jarakKm==null || jarakKm<0.05) return 0;
  if(jarakKm <= 3) return 5000;
  if(jarakKm <= 7) return 10000;
  if(jarakKm <= 12) return 15000;
  if(jarakKm <= 18) return 20000;
  if(jarakKm <= 24) return 30000;
  if(jarakKm <= 30) return 35000;
  return 35000 + Math.ceil(jarakKm - 30) * 1000;
}
async function cariMitraTerdekat(pLat,pLng,db,collection,query,where,getDocs){
  try{
    const q1 = query(collection(db,'users'), where('role','in',['mitra_usaha','mitra','toko','mitra usaha']));
    const snap1 = await getDocs(q1);
    let allMitra=[];
    snap1.forEach(d=>{ allMitra.push({id:d.id, ...d.data()}); });
    let terdekat=null; let jarakMin=Infinity;
    for(let m of allMitra){
      let mLat = m.tokoLat || m.toko_lat || m.lat || m.latitude || m.latToko || m.alamatToko?.lat || m.alamatPengiriman?.lat;
      let mLng = m.tokoLng || m.toko_lng || m.lng || m.longitude || m.lngToko || m.alamatToko?.lng || m.alamatPengiriman?.lng;
      if(!mLat || !mLng) continue;
      let jarak = hitungJarakKm(parseFloat(mLat), parseFloat(mLng), parseFloat(pLat), parseFloat(pLng));
      if(jarak!=null && jarak < jarakMin){
        jarakMin=jarak;
        terdekat={uid:m.id, nama:m.nama||m.namaToko||'Mitra', lat:parseFloat(mLat), lng:parseFloat(mLng), alamat:m.alamatToko||m.alamat||'', jarak:jarak};
      }
    }
    return terdekat;
  }catch(e){ console.error(e); return null; }
}

const rupiah=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');
function cartRead(){try{return JSON.parse(localStorage.getItem('tsa_cart')||'[]')}catch{return []}}
let pelangganLat=null, pelangganLng=null, mitraTerdekat=null, jarakKm=null, ongkir=5000;
async function ambilGPS(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej('No GPS');navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}), e=>rej(e.message), {enableHighAccuracy:true,timeout:15000,maximumAge:0});});}
async function proses(pLat,pLng){
  pelangganLat=pLat; pelangganLng=pLng;
  const st=document.getElementById('gpsStatus'); st.innerHTML=`📍 GPS Pelanggan: ${pLat.toFixed(6)}, ${pLng.toFixed(6)}<br>🔍 Mencari Mitra terdekat (GPS dari akun Mitra terdaftar)...`; st.className='note ok';
  mitraTerdekat = await cariMitraTerdekat(pLat,pLng,db,collection,query,where,getDocs);
  if(!mitraTerdekat){ st.innerHTML=`❌ Tidak ada Mitra dengan GPS di akun. Pastikan akun Mitra sudah isi lat/lng.<br>GPS Pelanggan: ${pLat.toFixed(6)}, ${pLng.toFixed(6)}`; st.className='note err'; jarakKm=0; ongkir=5000; }
  else { jarakKm=mitraTerdekat.jarak; ongkir=hitungOngkirFinal(jarakKm); st.innerHTML=`✅ Mitra terdekat: <b>${mitraTerdekat.nama}</b><br>📍 GPS Mitra (dari akun): ${mitraTerdekat.lat.toFixed(6)}, ${mitraTerdekat.lng.toFixed(6)}<br>📏 Jarak Pelanggan → Mitra: <b>${jarakKm.toFixed(1)} km</b><br>💰 Ongkir: <b>${rupiah(ongkir)}</b> (0-3km=5k, 24.2km=35k)<br>📍 GPS Pelanggan: ${pLat.toFixed(6)}, ${pLng.toFixed(6)}`; st.className='note ok'; }
  const data={lat:pLat,lng:pLng,jarakKm:jarakKm?parseFloat(jarakKm.toFixed(1)):0,ongkir:ongkir,mitraUid:mitraTerdekat?.uid||'',mitraNama:mitraTerdekat?.nama||'',mitraLat:mitraTerdekat?.lat||null,mitraLng:mitraTerdekat?.lng||null,gpsLink:`https://www.google.com/maps?q=${pLat},${pLng}`};
  localStorage.setItem('checkoutData', JSON.stringify(data)); localStorage.setItem('tsa_jarak', jarakKm?jarakKm.toFixed(1):'0'); localStorage.setItem('tsa_ongkir', ongkir);
  render();
}
function render(){
  const cart=cartRead(); let total=cart.reduce((s,x)=>s+(Number(x.price)||0)*(Number(x.qty)||1),0);
  document.getElementById('main').innerHTML=`
    <div class="card"><h3>Keranjang (${cart.length})</h3>
    ${cart.map(x=>`<div class="row"><span>${x.name} x${x.qty}</span><b>${rupiah((Number(x.price)||0)*(Number(x.qty)||1))}</b></div>`).join('')}
    <div class="row"><b>Total</b><b>${rupiah(total)}</b></div>
    <div class="row"><b>Ongkir <span class="badge">${jarakKm?jarakKm.toFixed(1)+' km':'0-3 km'}</span></b><b>${rupiah(ongkir)}</b></div>
    <div class="row" style="background:#111;color:#fff;border-radius:10px;padding:12px;"><b>TOTAL BAYAR</b><b style="color:#ffd400;font-size:18px;">${rupiah(total+ongkir)}</b></div></div>
    <div class="card"><h3>📍 Lokasi Pengiriman</h3><p class="muted">Klik GPS → sistem baca GPS Pelanggan + GPS Mitra dari akun Mitra terdaftar → hitung jarak.</p>
    <button id="btnGPS" class="btn">📍 Gunakan Lokasi Saya & Cari Mitra Terdekat</button>
    <div id="gpsStatus" class="note" style="margin-top:10px;">Belum ambil GPS.</div>
    <a id="linkMaps" href="#" target="_blank" style="display:none;" class="btn" style="margin-top:8px;text-align:center;display:none;">Buka di Maps</a>
    <a href="checkout.html" class="btn" style="margin-top:12px;display:block;text-align:center;text-decoration:none;">Checkout →</a></div>`;
  document.getElementById('btnGPS').onclick=async()=>{
    const b=document.getElementById('btnGPS'); b.disabled=true; b.textContent='Mengambil GPS...';
    try{ const loc=await ambilGPS(); await proses(loc.lat,loc.lng); document.getElementById('linkMaps').href=`https://www.google.com/maps?q=${loc.lat},${loc.lng}`; document.getElementById('linkMaps').style.display='block'; }catch(e){ document.getElementById('gpsStatus').innerHTML='❌ '+e; document.getElementById('gpsStatus').className='note err'; }finally{ b.disabled=false; b.textContent='📍 Gunakan Lokasi Saya & Cari Mitra Terdekat'; }
  };
  try{ const saved=JSON.parse(localStorage.getItem('checkoutData')||'null'); if(saved&&saved.lat){ pelangganLat=saved.lat; pelangganLng=saved.lng; jarakKm=saved.jarakKm; ongkir=saved.ongkir||5000; mitraTerdekat={uid:saved.mitraUid,nama:saved.mitraNama,lat:saved.mitraLat,lng:saved.mitraLng,jarak:saved.jarakKm}; const el=document.getElementById('gpsStatus'); if(el){ el.innerHTML=`✅ Tersimpan: Mitra ${saved.mitraNama||'-'} - ${saved.jarakKm} km - ${rupiah(saved.ongkir)}`; el.className='note ok'; } } }catch(e){}
}
render();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
