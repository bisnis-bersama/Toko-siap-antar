<!doctype html>
<html lang="id"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;

</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurir - Mode Bersih - Bukti ke Kolom J</title>
<style>
:root{--yellow:#ffcc00;--black:#111;--bg:#f8f9fa;--card:#fff;--line:#eef0f2;--muted:#8b8f97}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.head{max-width:720px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
main{max-width:720px;margin:0 auto;padding:12px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:800;cursor:pointer;background:var(--black);color:var(--yellow)}
.btn.yellow{background:var(--yellow);color:var(--black);width:100%}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.meta{font-size:11px;color:var(--muted)}
.ocr{white-space:pre-wrap;background:#f6f7f8;border-radius:12px;padding:10px;font-size:11px;max-height:120px;overflow:auto}
</style></head><body>
<header><div class="head"><div style="font-weight:900">🛵 Kurir — Bukti ke Kolom J</div><div style="background:var(--yellow);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800">Mode Bersih</div></div></header>
<main>
<div class="card"><label>URL Web App Spreadsheet</label><input id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec"><div class="meta" style="margin-top:6px">Foto akan masuk Drive + link otomatis masuk Kolom J (dulu COD). OCR masuk Firestore (gratis).</div></div>
<div class="card"><div id="myOrders" class="list">Memuat pesanan siap antar...</div></div>
</main>
<script type="module">
import {auth,db} from "./firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {doc,getDoc,collection,getDocs,query,where,limit,updateDoc,serverTimestamp,addDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rupiah=n=>"Rp "+(Number(n)||0).toLocaleString("id-ID");
let userNow=null;
let SHEET_URL=localStorage.getItem('sheet_j_bukti_url')||'';
window.addEventListener('load',()=>{ if(SHEET_URL) $("sheetUrl").value=SHEET_URL; });
$("sheetUrl").onchange=e=>{ localStorage.setItem('sheet_j_bukti_url', e.target.value.trim()); };
let tesseractLoader=null;
function loadTesseract(){ if(window.Tesseract) return Promise.resolve(window.Tesseract); if(tesseractLoader) return tesseractLoader; tesseractLoader=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload=()=>window.Tesseract?res(window.Tesseract):rej(Error("OCR gagal")); s.onerror=()=>rej(Error("Gagal load")); document.head.appendChild(s); }); return tesseractLoader; }
function toBase64(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function loadOrders(){
  try{
    const q=query(collection(db,'orders'), where('kurirUid','==',userNow.uid), where('status','in',['siap_antar','dalam_pengiriman','diantar']), limit(50));
    let snap; try{ snap=await getDocs(q);}catch{ const all=await getDocs(collection(db,'orders')); snap={docs:all.docs.filter(d=>d.data().kurirUid===userNow.uid)}; }
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    $("myOrders").innerHTML=docs.length?docs.map(o=>`<div class="item"><div style="display:flex;justify-content:space-between"><b>#${esc(o.nomorPesanan||o.id.slice(0,6))}</b><span style="background:#111;color:#ffcc00;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800">SIAP ANTAR</span></div><div style="margin-top:4px;font-weight:700">${esc(o.namaPelanggan||'-')} • ${rupiah(o.total||0)}</div><div class="meta">${esc(o.alamat||'-')}</div><div style="margin-top:10px"><input type="file" accept="image/*" id="f_${o.id}" style="font-size:12px"><button class="btn yellow" style="margin-top:8px" id="btn_${o.id}" onclick="selesaiUpload('${o.id}')">📸 Selesai — OCR ke Firestore, Foto ke Kolom J</button></div><div id="ocr_${o.id}" class="ocr" style="display:none;margin-top:8px"></div></div>`).join(''):'<div class="meta">Tidak ada pesanan siap antar</div>';
  }catch(e){ $("myOrders").innerHTML='Error '+esc(e.message); }
}
window.selesaiUpload=async orderId=>{
  const sheetUrl=$("sheetUrl").value.trim(); if(!sheetUrl){ alert('Isi URL Spreadsheet dulu'); return; }
  const file=document.getElementById('f_'+orderId)?.files?.[0]; if(!file){ alert('Pilih foto bukti dulu'); return; }
  const btn=document.getElementById('btn_'+orderId); const ocrBox=document.getElementById('ocr_'+orderId);
  try{
    btn.disabled=true; btn.textContent='⏳ Membaca OCR...'; await loadTesseract();
    const {data:{text}} = await Tesseract.recognize(file,'ind'); const ocrText=text.trim().slice(0,3000);
    if(!ocrText){ alert('OCR tidak terbaca'); btn.disabled=false; btn.textContent='📸 Selesai'; return; }
    ocrBox.style.display='block'; ocrBox.textContent='OCR (ke Firestore): '+ocrText;
    const base64=await toBase64(file);
    const ref=doc(db,'orders',orderId); const snap=await getDoc(ref); const o=snap.data();
    const productIds=(o.items||[]).map(it=>String(it.id||'')).filter(Boolean);
    btn.textContent='⏳ Simpan OCR ke Firestore...';
    await updateDoc(ref,{status:'menunggu_verifikasi', buktiPenyerahanOcr:ocrText, buktiPenyerahanFile:file.name, buktiPenyerahanAt:serverTimestamp(), buktiGambarDiSpreadsheet:true, updatedAt:serverTimestamp()});
    await addDoc(collection(db,'bukti_pengiriman'),{orderId, ocrText, fileName:file.name, kurirUid:userNow.uid, role:'kurir', createdAt:serverTimestamp()});
    btn.textContent='⏳ Kirim foto ke Kolom J...';
    await fetch(sheetUrl,{method:'POST', mode:'no-cors', body:JSON.stringify({type:'bukti_pengiriman', orderId, nomorPesanan:o.nomorPesanan||orderId.slice(0,6), ocrText, imageBase64:base64, fileName:file.name, productIds, sheetName:o.sheetName||'MOTOR'})});
    alert('✅ Sukses! OCR ke Firestore, foto masuk Drive + link masuk Kolom J (dulu COD). Status menunggu_verifikasi.');
    loadOrders();
  }catch(e){ alert('Gagal: '+e.message); btn.disabled=false; btn.textContent='📸 Selesai — OCR ke Firestore, Foto ke Kolom J'; }
};
onAuthStateChanged(auth, u=>{ if(!u){ location.href='./index.html'; return;} userNow=u; loadOrders(); });
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
