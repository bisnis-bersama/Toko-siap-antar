<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Input Produk Mitra</title>
<style>
*{box-sizing:border-box}body{background:#f8fdf9;margin:0;padding:12px;font-family:system-ui;max-width:480px;margin:auto}
.card-mitra{background:#eef6ee;border:1px solid #c8e6c9;border-radius:16px;padding:16px;margin:8px 0}
.card-form{background:#fff;border:1px solid #e0e0e0;border-radius:18px;padding:16px;margin:12px 0}
label{font-weight:700;font-size:14px;margin:14px 0 6px;display:block}
input,select{width:100%;border:1px solid #cfe5d8;border-radius:12px;padding:14px;font-size:14px}
.preview{width:100%;height:180px;background:#f6f6e8;border-radius:12px;display:grid;place-items:center;margin:10px 0;overflow:hidden;border:1px dashed #ddd}
.check-box{border:2px solid #ddd;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;flex:1;background:#fafafa;font-weight:600;font-size:13px}
.check-box.active{border-color:#00a85a;background:#e8f5e9}
.btn{width:100%;background:#00a85a;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;margin-top:12px}
</style></head><body>
<h2>📦 Input Produk Mitra</h2>
<div class="card-mitra">
<b id="mitraLabel">Memuat...</b><br>
<span id="mitraUidLabel" style="font-size:10px;color:#666"></span>
<a href="ewallet-mitra.html" id="btnLogin" style="display:none;background:#00a85a;color:#fff;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:12px">Login E-Wallet</a>
</div>
<div class="card-form">
<label>Nama Produk *</label><input id="nama" placeholder="Ayam goreng">
<label>Harga *</label><input id="harga" type="number" placeholder="15000">
<label>Stok</label><input id="stok" type="number" value="100">
<label>Deskripsi</label><input id="deskripsi" placeholder="jbl / Roko herbal">
<label>Kategori</label><select id="kategori"><option>Makanan</option><option>Minuman</option><option>Sparepart</option><option>Lainnya</option></select>
<label>Foto (kompres <45KB)</label><input id="foto" type="file" accept="image/*">
<div class="preview" id="preview">📦 Preview</div>
<label>🚚 Batas Pengiriman</label>
<div style="display:flex;gap:8px;margin:8px 0">
<label class="check-box active"><input type="checkbox" id="bisa_cod" checked> COD</label>
<label class="check-box active"><input type="checkbox" id="bisa_kurir" checked> Kurir</label>
<label class="check-box active"><input type="checkbox" id="bisa_expedisi" checked> Expedisi</label>
</div>
<button class="btn" id="btnSimpan">💾 Simpan ke Spreadsheet</button>
<div id="msg"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBxqZhl6t3RwrXMwVdJeIkg0NzGfwvlweM",authDomain:"toko-siap-antar-9a7bb.firebaseapp.com",projectId:"toko-siap-antar-9a7bb"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyvY5Cfm73AStD8Kz-_qYISexH4SBGDZyE3omXT2DnZwZbwqkxXtfcJBr1AmgFFTypN/exec";
let mitraNama='',mitraUid='',fotoPolos='';
function singkatan(n){if(!n)return 'MM';let w=n.trim().split(/\s+/);if(w.length>=2)return (w[0][0]+w[1][0]).toUpperCase();return n.slice(0,2).toUpperCase();}
async function kompres(file){return new Promise((res,rej)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=400,w=img.width,h=img.height;if(w>max){h=Math.round(h*max/w);w=max}if(h>400){w=Math.round(w*400/h);h=400}let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);let q=0.5,d=cv.toDataURL('image/jpeg',q),a=0;while(d.length>60000&&a<6){q-=0.07;if(q<0.15)break;d=cv.toDataURL('image/jpeg',q);a++}URL.revokeObjectURL(url);let polos=d.replace(/^data:image\/\w+;base64,[STRIPPED],'');res({dataUrl:d,polos});};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;});}
document.getElementById('foto').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;document.getElementById('preview').innerHTML='⏳';try{let r=await kompres(f);fotoPolos=r.polos;document.getElementById('preview').innerHTML=`<img src="${r.dataUrl}" style="width:100%;height:100%;object-fit:contain">`;}catch{document.getElementById('preview').innerHTML='Gagal'}});
document.getElementById('btnSimpan').onclick=async()=>{
let nama=document.getElementById('nama').value.trim();let harga=Number(document.getElementById('harga').value);let stok=Number(document.getElementById('stok').value)||100;let desk=document.getElementById('deskripsi').value.trim();let kat=document.getElementById('kategori').value;
let bisaCOD=document.getElementById('bisa_cod').checked?1:0;let bisaKurir=document.getElementById('bisa_kurir').checked?1:0;let bisaExp=document.getElementById('bisa_expedisi').checked?1:0;
if(!nama||!harga){alert('Nama & Harga wajib');return}if(!fotoPolos){alert('Pilih foto');return}if(!mitraUid){alert('Belum login');location.href='ewallet-mitra.html';return}
let btn=document.getElementById('btnSimpan');btn.disabled=true;btn.textContent='Menyimpan...';
try{let id='prcd_'+Date.now();let payload={action:'add_product',Column1:new Date().toLocaleString('id-ID'),Column2:id,Column3:nama,Column4:desk,Column5:harga,Column6:fotoPolos,Column7:mitraUid,Column8:mitraNama,Column9:kat,Column10:bisaCOD,Column11:bisaKurir,Column12:bisaExp,Column13:stok};await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});document.getElementById('msg').innerHTML=`<div style="background:#e5fff0;padding:10px;border-radius:10px;margin-top:10px">✅ Masuk Sheet MEMBER! ${nama} - COD:${bisaCOD?'Ya':'Tidak'} Kurir:${bisaKurir?'Ya':'Tidak'} Exp:${bisaExp?'Ya':'Tidak'}</div>`;document.getElementById('nama').value='';document.getElementById('harga').value='';}catch(e){document.getElementById('msg').innerHTML=e.message}btn.disabled=false;btn.textContent='💾 Simpan ke Spreadsheet';};
function setMitraUI(user,src){let lab=document.getElementById('mitraLabel'),uidL=document.getElementById('mitraUidLabel'),log=document.getElementById('btnLogin');if(!user){lab.textContent='⚠️ Belum login';uidL.textContent=src;log.style.display='inline-block';mitraUid='';return;}mitraUid=user.uid||'';uidL.textContent=mitraUid+' ('+src+')';log.style.display='none';mitraNama=user.email||'Mitra';lab.textContent='👤 '+mitraNama;if(user.uid){getDoc(doc(db,'users',user.uid)).then(snap=>{if(snap.exists()){let d=snap.data();mitraNama=d.nama||d.namaToko||user.email||'Mitra';lab.textContent='👤 '+mitraNama+' ('+singkatan(mitraNama)+')';}});}}
onAuthStateChanged(auth,user=>setMitraUI(user,'authState'));
setTimeout(()=>{let lab=document.getElementById('mitraLabel');if(lab.textContent.includes('Memuat')){if(auth.currentUser)setMitraUI(auth.currentUser,'fallback');else setMitraUI(null,'no user');}},1500);
</script></body></html>
